<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Интернэт холболт алга</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #dae0da; color: #17181b; font-family: "Golos Text", system-ui, sans-serif; text-align: center; padding: 24px; }
    main { max-width: 420px; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { color: #545958; line-height: 1.6; margin: 0 0 20px; }
    button { border: 0; border-radius: 999px; background: #b01729; color: #fff; font: inherit; font-weight: 700; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Интернэт холболт алга</h1>
    <p>Сүлжээ сэргэмэгц дэлгүүр дахин нээгдэнэ. Сагс болон захиалга тань хадгалагдсан.</p>
    <button type="button" onclick="location.reload()">Дахин оролдох</button>
  </main>
</body>
</html>
