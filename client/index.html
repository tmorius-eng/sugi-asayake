<!doctype html>
<html lang="mn">

  <head>
    <meta charset="UTF-8" />
    <!-- 2026-09-06 (real a11y-audit finding, axe-core meta-viewport): had
         maximum-scale=1, which disables pinch-to-zoom -- a real WCAG 1.4.4
         failure for any low-vision visitor who needs to zoom in. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="theme-color" content="#e31b3b" />
    <link rel="canonical" href="%SEO_CANONICAL%" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="mn_MN" />
    <meta property="og:site_name" content="%SEO_SITE_NAME%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%SEO_SITE_NAME%" />
    <meta name="twitter:description" content="%SEO_TWITTER_DESCRIPTION%" />
    <script type="application/ld+json">%SEO_STRUCTURED_DATA%</script>
    <link rel="icon" type="image/png" href="/cdn/sugi-symbol_0a534a76.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 2026-09-06: replaced DM Sans + Space Grotesk + "Noto Sans Mongolian" --
         verified via Google's actual served css2 responses that NONE of those
         three contain any Cyrillic glyphs ("Noto Sans Mongolian" is Google's
         font for the old vertical/traditional script, U+1800-18AF, not
         Cyrillic). Since this site's Mongolian text is ~100% Cyrillic, it was
         silently rendering in the OS default font the whole time. Golos Text
         is a true variable font (wght 400..900 in one file/subset) with real
         cyrillic + cyrillic-ext coverage (confirmed unicode-range includes
         U+0460-052F, covering Өө/Үү) -- see index.css:96-97 for the matching
         --font-body/--font-display values. -->
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet" />
    <!-- Silktide Consent Manager (2026-09-06) -- self-hosted per Tom's explicit
         instruction, not the CDN-hosted default. The 2 files under
         client/public/vendor/ are byte-verified against the vendor's published
         SHA-384 SRI hashes (see git history / commit message for the exact
         verification commands) before being committed, so this is a known-good,
         pinned v2.0.1 copy -- update by re-downloading + re-verifying, not by
         hand-editing. Real API/storage-key facts below were confirmed by reading
         this exact shipped source, not the docs: consentTypes is a freely-defined
         array (no fixed category set), choices are stored ONLY in localStorage
         under literal keys `stcm.consent.${typeId}` (no namespace configured
         here, so exactly `stcm.consent.essential` / `stcm.consent.analytics`),
         and the value comparison this codebase relies on elsewhere
         (client/src/lib/cookieConsent.ts) is the library's own literal
         `value === 'true'` check. This site sets exactly 3 real cookies
         (shared/const.ts) -- 2 strictly necessary (session, guest cart) and 1
         first-party analytics cookie (sugi_visitor_session) gated behind the
         "analytics" consentType below via that one localStorage read, not a
         script-injection integration (no 3rd-party script exists anywhere in
         this codebase to gate). -->
    <link rel="stylesheet" href="/vendor/silktide-consent-manager.css">
    <script src="/vendor/silktide-consent-manager.js"></script>
    <script>
      window.silktideConsentManager.init({
        prompt: { position: "bottomRight" },
        icon: { position: "bottomLeft" },
        backdrop: { show: false },
        consentTypes: [
          {
            id: "essential",
            label: "%COOKIE_ESSENTIAL_LABEL%",
            description: "%COOKIE_ESSENTIAL_DESCRIPTION%",
            required: true,
          },
          {
            id: "analytics",
            label: "%COOKIE_ANALYTICS_LABEL%",
            description: "%COOKIE_ANALYTICS_DESCRIPTION%",
            required: false,
            defaultValue: false,
          },
        ],
        text: {
          prompt: {
            description: "%COOKIE_PROMPT_DESCRIPTION%",
            acceptAllButtonText: "%COOKIE_ACCEPT_ALL%",
            rejectNonEssentialButtonText: "%COOKIE_REJECT%",
            preferencesButtonText: "%COOKIE_PREFERENCES_BUTTON%",
            // Accessible name for the icon-only "close preferences" button;
            // without it the vendor renders an unlabeled <button>.
            preferencesButtonAccessibleLabel: "Күүкийн тохиргоог хаах",
          },
          preferences: {
            title: "%COOKIE_PREFERENCES_TITLE%",
            description: "%COOKIE_PREFERENCES_DESCRIPTION%",
            saveButtonText: "%COOKIE_SAVE%",
          },
        },
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
