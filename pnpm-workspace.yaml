# 2026-09-09 deep audit: transitive-dependency overrides live in package.json's
# "pnpm.overrides" key. pnpm 10.4.1 prints "no longer read" for that key but
# demonstrably applies it (the overrides land in pnpm-lock.yaml's
# `overrides:` block and the resolved graph changes), whereas overrides
# declared HERE were verified on 2026-09-06 to be silently ignored by this
# exact pnpm version (pnpm/pnpm#10614, #10675). Keep them in ONE place until
# the pinned pnpm version is upgraded; then move them here and delete the
# package.json key. Ranges are bounded to the dependent's own major on
# purpose -- an unbounded ">=1.20.8" once pulled body-parser 2 and
# path-to-regexp 8 under express 4.
