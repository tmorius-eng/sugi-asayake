# External uptime check (2026-09-14).
#
# The shop runs on one Oracle VM; nothing outside that VM was watching it.
# GitHub's scheduler runs this from GitHub's own network every 10 minutes
# (GitHub may delay cron by a few minutes under load): it fetches /health
# with two retries and, when the site is down or the database reports
# "down", posts to the shop's ntfy topic -- the same phone push channel the
# admin bell already uses.
#
# Secrets to add once (repo -> Settings -> Secrets and variables -> Actions):
#   NTFY_URL    e.g. https://ntfy.sh/<the admin topic>
#   NTFY_TOKEN  the ntfy access token (Bearer)
# Without them the job still runs and fails visibly in the Actions tab.
name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /health (3 attempts, 20 s apart)
        id: probe
        run: |
          set +e
          # 2026-09-20: Cloudflare-ийн Bot Fight Mode нь GitHub-ийн дата төвийн
          # IP-ээс ирсэн энэ хүсэлтэд "Just a moment..." managed challenge (HTTP
          # 403) буцааж эхэлсэн — 2026-09-18-аас хойш run бүр унаж, сайт эрүүл
          # байхад "DOWN" гэж дуугарч байв. Тайлбарласан User-Agent нь curl-ийн
          # анхдагчаас илүү тул зарим тохиолдолд challenge-д өртөхгүй өнгөрдөг;
          # өртсөн тохиолдолд доор challenge-ийг ТАНИЖ, "сайт унасан" гэхийн
          # оронд "мониторыг хаасан" гэж үнэн зөвөөр мэдээлнэ.
          UA="SUGI-ASAYAKE-uptime/1.0 (+https://github.com/tmorius-eng/sugi-asayake)"
          blocked=0
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 20 -A "$UA" -w '\n%{http_code}' https://sugi.karkaron.com/health)
            code=$(echo "$body" | tail -1)
            json=$(echo "$body" | head -n -1)
            echo "attempt $attempt: HTTP $code ${json:0:200}"
            if [ "$code" = "200" ] && echo "$json" | grep -q '"database":"up"'; then
              echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            case "$json" in *"__cf_chl"*|*"Just a moment"*|*"cf-browser-verification"*) blocked=1 ;; esac
            sleep 20
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          if [ "$blocked" = "1" ]; then
            # Сайт унасан гэсэн ҮГ БИШ: ирмэг дээр хаагдсан тул төлөв нь ҮЛ МЭДЭГДЭХ.
            echo "detail=Cloudflare challenge (HTTP $code) — мониторыг ирмэг дээр хаасан тул сайтын төлөв ҮЛ МЭДЭГДЭХ. Bot Fight Mode / WAF-ийн тохиргоо хэрэгтэй." >> "$GITHUB_OUTPUT"
          else
            echo "detail=HTTP ${code:-none} ${json:-no body}" >> "$GITHUB_OUTPUT"
          fi
      - name: Push alert to the phone
        if: steps.probe.outputs.ok == 'false' && env.NTFY_URL != ''
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          curl -sS --max-time 20 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: ${{ steps.probe.outputs.blocked == '1' && 'sugi.karkaron.com: monitor blocked (status unknown)' || 'sugi.karkaron.com is DOWN' }}" \
            -H "Priority: 5" -H "Tags: rotating_light" \
            -d "3 удаа дараалан амжилтгүй: ${{ steps.probe.outputs.detail }} Шалгах: ssh sugi-oci 'pm2 logs sugi --lines 40'" \
            "$NTFY_URL"
      - name: Fail the run when down
        if: steps.probe.outputs.ok == 'false'
        run: exit 1
