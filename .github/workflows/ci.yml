name: CI

# ROADMAP.md TIER 5: run the same three checks on every push/PR that a
# contributor is expected to run locally before merging. The first job has
# no database (the gated suites skip themselves); the second job
# (2026-09-14) stands up MySQL 8, applies every migration from scratch, seeds
# the four branches, and runs the auth + commerce integration suites -- so a
# database-touching regression is caught here, not only on a laptop. Media
# (S3) suites stay laptop-only.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No `version:` here on purpose — pnpm/action-setup reads the pinned
      # version from package.json's "packageManager" field. Setting both
      # causes ERR_PNPM_BAD_PM_VERSION (two pnpm versions specified).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      # No env block needed. The "integration config encryption (unit)"
      # tests in server/integrations.integration.test.ts run ungated and
      # need SOME 64-char hex INTEGRATIONS_ENCRYPTION_KEY; server/
      # _test-setup.ts supplies a throwaway one when the environment has
      # none, so this workflow needs no repository secret. The application
      # itself still refuses to encrypt without a real key -- the fallback
      # lives only in the test setup.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sugi_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Loopback: the app's connection planner skips TLS for 127.0.0.1.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sugi_test
      JWT_SECRET: ci-only-secret-0123456789
      OWNER_EMAIL: ci@example.invalid
      RUN_AUTH_INTEGRATION_TESTS: "1"
      COMMERCE_INTEGRATION_TESTS: "1"
      NOTIFICATIONS_SUPPRESS: "1"
      ADMIN_FACE_GATE_ENABLED: "0"
      MODERATION_MODEL: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the empty database
        run: pnpm exec tsx scripts/db-apply-all-migrations.ts
      - name: Seed reference rows (branches)
        run: pnpm exec tsx scripts/ci-seed.ts
      - name: Integration tests (auth + commerce)
        run: pnpm exec vitest run --no-file-parallelism
