name: CI

# ROADMAP.md TIER 5: run the same three checks on every push/PR that a
# contributor is expected to run locally before merging. Intentionally does
# NOT stand up MySQL/S3 services — the gated integration test suites
# (RUN_AUTH_INTEGRATION_TESTS, COMMERCE_INTEGRATION_TESTS,
# RUN_MEDIA_INTEGRATION_TESTS) stay opt-in and skip themselves when those env
# vars are unset, so `pnpm test` here runs the full non-DB unit suite only.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No `version:` here on purpose — pnpm/action-setup reads the pinned
      # version from package.json's "packageManager" field. Setting both
      # causes ERR_PNPM_BAD_PM_VERSION (two pnpm versions specified).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test
        env:
          # server/integrations.integration.test.ts's "integration config
          # encryption (unit)" tests call encryptJson/decryptJson
          # unconditionally (not gated behind the RUN_*_INTEGRATION_TESTS
          # flags the rest of that file uses), and server/_core/crypto.ts's
          # getKey() throws immediately if this isn't a 64-char hex string --
          # so CI needs it even though this workflow never touches a real
          # database. Add INTEGRATIONS_ENCRYPTION_KEY as a repo secret
          # (Settings -> Secrets and variables -> Actions -> New repository
          # secret) with a real generated key -- never commit the key
          # itself. Generate one locally with:
          #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
          INTEGRATIONS_ENCRYPTION_KEY: ${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}

      - name: Build
        run: pnpm build
